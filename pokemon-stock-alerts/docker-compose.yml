services:
  pokealert:
    build:
      context: .
      args:
        WITH_BROWSER: "1"   # set to "0" for a smaller image if no watch uses render: true
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    shm_size: 512mb         # headless Chromium needs more than Docker's 64 MB default
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
